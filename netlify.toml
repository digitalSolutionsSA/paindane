[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed JS/CSS bundles never change: cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimised photos (regenerated by `npm run images`): cache for 30 days
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Pages always revalidate so updates show straight away
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Staff portal: keep it out of search engines
[[headers]]
  for = "/dssa-portals/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
